version: 2

# Keep routine upgrades within the current major version. Dependabot still
# raises security updates even when they require a major-version change.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    labels:
      - dependencies
      - security

  - package-ecosystem: gomod
    directory: /agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    labels:
      - dependencies

  - package-ecosystem: gomod
    directory: /cloud-infra
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /cloud-infra/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    labels:
      - dependencies
      - frontend

  - package-ecosystem: docker
    directory: /cloud-infra/deploy/compose
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    labels:
      - dependencies
      - containers
