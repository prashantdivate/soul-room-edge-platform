name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Agent
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Check formatting
        run: |
          gofmt -w ./cmd ./internal ./pkg
          git diff --exit-code -- .
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Cross-compile supported Linux targets
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/...
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/...
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build ./cmd/...

  control-plane:
    name: Control plane
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cloud-infra
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Check formatting
        run: |
          gofmt -w ./cmd ./internal
          git diff --exit-code -- .
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/...

  web:
    name: Web console
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cloud-infra/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloud-infra/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Reject high and critical npm advisories
        run: npm audit --audit-level=high

  compose:
    name: Compose configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate deployment configuration
        working-directory: cloud-infra
        run: docker compose config --quiet
