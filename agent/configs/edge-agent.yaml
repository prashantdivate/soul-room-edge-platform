version: 1
server:
  endpoint: https://127.0.0.1:9443
  ca_file: .dev-control-plane/ca.pem
  connect_timeout: 15s
identity:
  state_dir: .edge-agent/identity
  use_tpm: false
storage:
  state_dir: .edge-agent
  max_queue_bytes: 104857600
  max_queue_age: 168h
telemetry:
  interval: 60s
  jitter: 10s
  collectors:
    cpu: true
    memory: true
    disk: true
    network: true
    uptime: true
    os: true
    processes: false
jobs:
  max_concurrent: 2
  default_timeout: 10m
  allow_shell: false
containers:
  provider: docker
  socket: unix:///var/run/docker.sock
gateway:
  enabled: true
  connector_dir: /etc/edge-agent/connectors.d
location:
  source: disabled
  latitude: 0
  longitude: 0
  label: ""
  gpsd_address: 127.0.0.1:2947
  ip_url: https://ipwho.is/
ota:
  enabled: true
  product: embedded-linux
  state_dir: /var/lib/edge-agent/ota
  staging_dir: /var/lib/edge-agent/ota/staging
  trusted_keys_dir: /etc/edge-agent/trusted-update-keys
  plugin_dir: /usr/libexec/edge-agent/ota
  max_artifact_bytes: 4294967296
  min_free_bytes: 268435456
  download_timeout: 2h
  health_timeout: 2m
  health_check_command: ""
  auto_reboot: false
