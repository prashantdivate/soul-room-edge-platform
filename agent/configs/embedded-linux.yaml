version: 1
server:
  endpoint: https://device-gateway.example.com:8443
  ca_file: /etc/edge-agent/ca.pem
  connect_timeout: 15s
identity:
  state_dir: /var/lib/edge-agent/identity
  use_tpm: false
storage:
  state_dir: /var/lib/edge-agent
  max_queue_bytes: 104857600
  max_queue_age: 168h
telemetry:
  interval: 30s
  jitter: 5s
  collectors:
    cpu: true
    memory: true
    disk: true
    network: true
    uptime: true
    os: true
    processes: false
jobs:
  max_concurrent: 2
  default_timeout: 10m
  allow_shell: false
containers:
  provider: docker
  socket: unix:///var/run/docker.sock
gateway:
  enabled: false
  connector_dir: /etc/edge-agent/connectors.d
location:
  source: disabled
  latitude: 0
  longitude: 0
  label: ""
  gpsd_address: 127.0.0.1:2947
