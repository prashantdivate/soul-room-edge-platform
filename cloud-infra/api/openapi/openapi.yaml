openapi: 3.1.0
info:
  title: Soul Room Control Plane API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      summary: Create a server-side session
      responses:
        "200": { description: Login accepted }
        "401": { description: Invalid credentials }
  /organizations:
    get:
      summary: List organizations visible to the caller
      responses:
        "200": { description: Organizations }
    post:
      summary: Create an organization
      responses:
        "201": { description: Organization created }
  /users:
    get:
      summary: List tenant users
      responses:
        "200": { description: Users }
    post:
      summary: Create a tenant user with a built-in role
      responses:
        "201": { description: User created }
        "403": { description: Administrative role required }
  /roles:
    get:
      summary: List roles and permissions
      responses:
        "200": { description: Roles }
  /enrollment-tokens:
    post:
      summary: Create a one-time enrollment token
      responses:
        "201": { description: Token created }
  /devices:
    get:
      summary: List devices
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200": { description: Devices }
    delete:
      summary: Remove a registered device and its operational records
      parameters:
        - name: device_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: Device removed; audit history retained }
        "403": { description: Administrative role required }
        "404": { description: Device not found }
  /devices/{device_id}:
    get:
      summary: Get device detail
      parameters:
        - name: device_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Device }
  /telemetry:
    get:
      summary: Query telemetry
      responses:
        "200": { description: Telemetry samples }
  /jobs:
    get:
      summary: List jobs
      responses:
        "200": { description: Jobs }
    post:
      summary: Create typed job
      responses:
        "201": { description: Job created }
    delete:
      summary: Remove a terminal job history entry
      parameters:
        - name: job_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: Job history removed; audit history retained }
        "409": { description: Job has not reached a terminal state }
  /deployments:
    get:
      summary: List deployments
      responses:
        "200": { description: Deployments }
  /applications:
    get:
      summary: List applications
      responses:
        "200": { description: Applications }
  /artifacts:
    get:
      summary: List artifacts
      responses:
        "200": { description: Artifacts }
  /ota:
    get:
      summary: List OTA campaigns
      responses:
        "200": { description: OTA campaigns }
    post:
      summary: Create a signed, capability-gated OTA campaign and queue its pilot group
      responses:
        "201": { description: OTA campaign created }
        "400": { description: Invalid release metadata or incompatible target }
  /platform-settings:
    get:
      summary: Read effective tenant settings and safe infrastructure metadata
      responses:
        "200": { description: Effective platform settings and their source }
    put:
      summary: Replace the tenant platform-settings override
      responses:
        "200": { description: Settings validated, persisted, and activated }
        "400": { description: Invalid setting value }
        "403": { description: Tenant settings permission required }
    delete:
      summary: Restore environment or built-in deployment defaults
      responses:
        "200": { description: Tenant override removed }
        "403": { description: Tenant settings permission required }
  /alerts:
    get:
      summary: List alerts
      responses:
        "200": { description: Alerts }
  /audit:
    get:
      summary: List audit events
      responses:
        "200": { description: Audit events }
components:
  schemas:
    PlatformSettings:
      type: object
      required:
        - organization_name
        - device_offline_minutes
        - default_telemetry_window
        - default_ota_pilot_percent
        - default_enrollment_ttl_hours
        - default_job_ttl_minutes
      properties:
        organization_name: { type: string, minLength: 2, maxLength: 80 }
        company_domain: { type: string, examples: [devices.example.com] }
        device_offline_minutes: { type: integer, minimum: 2, maximum: 1440 }
        default_telemetry_window: { type: string, enum: [15m, 1h, 24h] }
        default_ota_pilot_percent: { type: integer, minimum: 1, maximum: 100 }
        default_enrollment_ttl_hours: { type: integer, minimum: 1, maximum: 720 }
        default_job_ttl_minutes: { type: integer, minimum: 5, maximum: 10080 }
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: soul_room_session
    BearerToken:
      type: http
      scheme: bearer
