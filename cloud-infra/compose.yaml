name: unified-fleet

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: unified_fleet
      POSTGRES_USER: unified_fleet
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unified_fleet -d unified_fleet"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: local-dev-minio
      MINIO_ROOT_PASSWORD: local-dev-minio-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  seed:
    build:
      context: .
      dockerfile: deploy/compose/service.Dockerfile
    command: /dev-seed
    user: "0:0"
    environment:
      UFM_STORE_PATH: /data/control-plane.json
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: "no"

  platform:
    build:
      context: .
      dockerfile: deploy/compose/service.Dockerfile
    command: /platform
    user: "0:0"
    environment:
      UFM_HTTP_ADDR: 0.0.0.0:8080
      UFM_DEVICE_ADDR: 0.0.0.0:8443
      UFM_DEVICE_PUBLIC_HOST: ${UFM_DEVICE_PUBLIC_HOST:-localhost}
      UFM_STORE_PATH: /data/control-plane.json
      UFM_DEV_CA_DIR: /data/ca
      UFM_SHELLHUB_URL: ${UFM_SHELLHUB_URL:-}
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - app-data:/data
    depends_on:
      seed:
        condition: service_completed_successfully

  web-ui:
    build:
      context: .
      dockerfile: deploy/compose/web.Dockerfile
    ports:
      - "3080:80"
    depends_on:
      platform:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12

  backup:
    image: postgres:16
    profiles: ["maintenance"]
    environment:
      PGPASSWORD: local-dev-only
    volumes:
      - app-data:/source/app:ro
      - minio-data:/source/minio:ro
      - ./backups:/backup
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        stamp=$$(date +%Y%m%d%H%M%S)
        pg_dump -h postgres -U unified_fleet unified_fleet > /backup/postgres-$${stamp}.sql
        tar czf /backup/data-$${stamp}.tgz -C /source app minio
        echo "Backup set: $${stamp}"

  restore:
    image: postgres:16
    profiles: ["maintenance"]
    environment:
      PGPASSWORD: local-dev-only
      BACKUP_SET: ${BACKUP_SET:-}
    volumes:
      - app-data:/source/app
      - minio-data:/source/minio
      - ./backups:/backup:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        test -n "$${BACKUP_SET}"
        psql -h postgres -U unified_fleet unified_fleet < /backup/postgres-$${BACKUP_SET}.sql
        tar xzf /backup/data-$${BACKUP_SET}.tgz -C /source
        echo "Restored backup set: $${BACKUP_SET}"

volumes:
  postgres-data:
  minio-data:
  app-data:
