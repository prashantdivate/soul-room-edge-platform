apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-fleet-control-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unified-fleet-control-api
  template:
    metadata:
      labels:
        app: unified-fleet-control-api
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: control-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
